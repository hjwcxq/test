<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2e9" />
    <meta name="description" content="文思：上海卷、江苏与浙江高考作文真题解题库，以及自定义作文题目结构化剖析工具" />
    <title>文思 · 高考作文指导</title>
    <!-- 服务端按 X-Forwarded-Prefix / APP_BASE_PATH / 请求路径注入实际基础路径；未注入时前端自行探测。 -->
    <script>window.__APP_BASE_PATH__ = "__APP_BASE_PATH__";</script>
    <!-- 服务端按部署环境变量 / 构建产物注入当前版本；未注入时前端使用构建期版本。 -->
    <script>window.__APP_VERSION__ = "__APP_VERSION__";</script>
  </head>
  <body>
    <!-- 当前版本号由服务端在返回 HTML 时写入（__APP_VERSION_TEXT__）：
         首屏无需等待脚本执行即可见，也不会与 React 渲染的页头产生重复节点。 -->
    <div class="app-version-bar">
      <div class="container app-version-bar-inner">
        <span class="app-version" id="app-version" data-testid="app-version" title="本次打开的交付版本">当前版本：<strong data-version-value>__APP_VERSION_TEXT__</strong></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
